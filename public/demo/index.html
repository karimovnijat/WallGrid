<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WallGrid demo</title>
  <!--
    Self-contained demo tile for trying WallGrid without any external sites.
    Query parameters:
      kind  = clock | chart | stats | map   (default: clock)
      title = label shown on the tile
      hue   = 0–360 accent colour
    Example: /demo/?kind=chart&title=Traffic&hue=200
  -->
  <style>
    :root { --h: 210; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      display: flex;
      flex-direction: column;
      padding: 4vmin;
      color: #eef3fb;
      font: 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(120% 90% at 0% 0%, hsl(var(--h) 70% 22%) 0%, transparent 60%),
        radial-gradient(90% 90% at 100% 100%, hsl(calc(var(--h) + 40) 60% 16%) 0%, transparent 60%),
        #070b13;
    }
    header { display: flex; align-items: center; justify-content: space-between; gap: 2vmin; }
    h1 { margin: 0; font-size: clamp(14px, 5vmin, 44px); font-weight: 700; letter-spacing: -0.01em; }
    .live { display: flex; align-items: center; gap: 1vmin; font-size: clamp(10px, 2.6vmin, 18px); color: hsl(var(--h) 80% 75%); }
    .live::before { content: ""; width: 1.4vmin; height: 1.4vmin; min-width: 6px; min-height: 6px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 10px #3ddc84; animation: blink 1.6s infinite; }
    @keyframes blink { 50% { opacity: 0.3; } }
    main { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
    .clock { font-size: clamp(28px, 22vmin, 260px); font-weight: 200; font-variant-numeric: tabular-nums; letter-spacing: -0.04em; }
    .date { margin-top: 1vmin; text-align: center; font-size: clamp(12px, 4vmin, 34px); color: hsl(var(--h) 40% 75%); }
    canvas { width: 100%; height: 100%; display: block; }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3vmin; width: 100%; }
    .stat { padding: 3vmin; border-radius: 2vmin; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); }
    .stat b { display: block; font-size: clamp(18px, 9vmin, 90px); font-weight: 650; font-variant-numeric: tabular-nums; }
    .stat span { font-size: clamp(10px, 3vmin, 22px); color: hsl(var(--h) 30% 72%); }
    .up { color: #3ddc84; } .down { color: #ff6b6b; }
  </style>
</head>
<body>
  <header><h1 id="title">Demo</h1><div class="live">LIVE</div></header>
  <main id="main"></main>
  <script>
    const q = new URLSearchParams(location.search);
    const kind = q.get('kind') || 'clock';
    document.documentElement.style.setProperty('--h', Number(q.get('hue')) || 210);
    document.getElementById('title').textContent = q.get('title') || kind[0].toUpperCase() + kind.slice(1);
    const main = document.getElementById('main');

    if (kind === 'clock') {
      main.innerHTML = '<div><div class="clock" id="c"></div><div class="date" id="d"></div></div>';
      const tick = () => {
        const now = new Date();
        c.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        d.textContent = now.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
      };
      tick();
      setInterval(tick, 1000);
    }

    if (kind === 'stats') {
      const items = [['Orders', 1284, 1], ['Revenue', 48210, 1], ['Tickets', 37, -1], ['Uptime %', 99.98, 1]];
      main.innerHTML = '<div class="stats">' + items.map(([label], i) =>
        `<div class="stat"><b id="s${i}"></b><span>${label} <i id="t${i}"></i></span></div>`).join('') + '</div>';
      const draw = () => items.forEach(([, base, dir], i) => {
        const v = base % 1 ? Math.min(99.99, base - Math.random() * 0.05) : base * (1 + (Math.random() - 0.45) * 0.04);
        document.getElementById('s' + i).textContent = base % 1 ? v.toFixed(2) : Math.round(v).toLocaleString();
        const t = document.getElementById('t' + i);
        t.textContent = dir > 0 ? '▲' : '▼';
        t.className = dir > 0 ? 'up' : 'down';
      });
      draw();
      setInterval(draw, 2500);
    }

    if (kind === 'chart' || kind === 'map') {
      main.innerHTML = '<canvas id="cv"></canvas>';
      const cv = document.getElementById('cv');
      const ctx = cv.getContext('2d');
      const h = Number(q.get('hue')) || 210;
      const series = Array.from({ length: 60 }, (_, i) => 50 + Math.sin(i / 6) * 20 + Math.random() * 10);
      const dots = Array.from({ length: 40 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 6 + 2, p: Math.random() * 6 }));
      const resize = () => { cv.width = cv.clientWidth * devicePixelRatio; cv.height = cv.clientHeight * devicePixelRatio; };
      addEventListener('resize', resize);
      resize();
      let t = 0;
      const frame = () => {
        const W = cv.width, H = cv.height;
        ctx.clearRect(0, 0, W, H);
        if (kind === 'chart') {
          if (t++ % 30 === 0) { series.shift(); series.push(50 + Math.sin(t / 40) * 20 + Math.random() * 12); }
          ctx.strokeStyle = 'rgba(255,255,255,0.07)';
          for (let i = 1; i < 5; i++) { ctx.beginPath(); ctx.moveTo(0, H * i / 5); ctx.lineTo(W, H * i / 5); ctx.stroke(); }
          const pts = series.map((v, i) => [i / (series.length - 1) * W, H - v / 100 * H]);
          const g = ctx.createLinearGradient(0, 0, 0, H);
          g.addColorStop(0, `hsla(${h},90%,60%,0.45)`);
          g.addColorStop(1, `hsla(${h},90%,60%,0)`);
          ctx.beginPath(); ctx.moveTo(0, H); pts.forEach(([x, y]) => ctx.lineTo(x, y)); ctx.lineTo(W, H); ctx.fillStyle = g; ctx.fill();
          ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
          ctx.strokeStyle = `hsl(${h},90%,65%)`; ctx.lineWidth = 3 * devicePixelRatio; ctx.stroke();
        } else {
          t += 0.03;
          ctx.strokeStyle = 'rgba(255,255,255,0.06)';
          for (let i = 0; i < 12; i++) { ctx.beginPath(); ctx.moveTo(W * i / 12, 0); ctx.lineTo(W * i / 12, H); ctx.stroke(); }
          for (let i = 0; i < 8; i++) { ctx.beginPath(); ctx.moveTo(0, H * i / 8); ctx.lineTo(W, H * i / 8); ctx.stroke(); }
          dots.forEach((d) => {
            const pulse = (Math.sin(t + d.p) + 1) / 2;
            ctx.beginPath(); ctx.arc(d.x * W, d.y * H, (d.r + pulse * 10) * devicePixelRatio, 0, 7);
            ctx.fillStyle = `hsla(${h},90%,60%,${0.15 * (1 - pulse)})`; ctx.fill();
            ctx.beginPath(); ctx.arc(d.x * W, d.y * H, d.r * devicePixelRatio, 0, 7);
            ctx.fillStyle = `hsl(${h},90%,65%)`; ctx.fill();
          });
        }
        requestAnimationFrame(frame);
      };
      frame();
    }
  </script>
</body>
</html>
